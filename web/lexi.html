<title>Lexi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600;700&display=swap">
<style>
/* Layout: the Lexi wireframe phone (Miro Screens 11–15): 48px accent top bar, 14px accent side rails,
   a fixed-width column of bot bubbles, and an accent dock with big nav icons above a white input pill.
   Default tokens are the Orange theme (Screen 11); dark falls back to Ember (Screen 15). */
:root{
  --bg:#E6E6E6; --surface:#FFFFFF; --surface-2:#F3F3F3; --ink:#020000; --ink-soft:#4B4B4B; --line:#D2D2D2;
  --bar:#E38100; --on-bar:#1E1000; --rail:#E38100;
  --pill:#FFFFFF; --pill-ink:#020000;
  --accent:#8100E3; --on-accent:#FFFFFF;
  --bot:#79EAB9; --bot-ink:#020000; --me:#FFFFFF; --me-ink:#020000;
  --yes:#8100E3; --yes-ink:#FFFFFF; --no-bg:#FFFFFF; --no-line:#8100E3; --no-ink:#020000;
  --b-content:#E38100; --b-content-ink:#1E1000; --b-stressed:#79EAB9; --b-stressed-ink:#06281A; --b-low:#8100E3; --b-low-ink:#FFFFFF;
  --tab-on:#FFFFFF; --tab-on-ink:#020000;
  --shadow:rgba(0,0,0,.10); --scrim:rgba(0,0,0,.45);
  --deco:#000000; --deco-o:0; --deco-img:none;
  --danger:#C0352B; --on-danger:#FFFFFF;
  --font:Verdana,"Atkinson Hyperlegible","DejaVu Sans",Tahoma,sans-serif;
  --font-display:"Lexend",Verdana,"DejaVu Sans",sans-serif;
  --fs:18px; --lh:1.7; --r-s:14px; --r-m:22px; --r-l:28px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#201B17; --surface:#2B2520; --surface-2:#352F2B; --ink:#ECE0DA; --ink-soft:#D6C3B6; --line:#51443A;
    --bar:#201B17; --on-bar:#FFB877; --rail:#201B17; --pill:#352F2B; --pill-ink:#ECE0DA;
    --accent:#FFB877; --on-accent:#4C2700; --bot:#FFB877; --bot-ink:#4C2700; --me:#51443A; --me-ink:#FFDCC1;
    --yes:#4C2700; --yes-ink:#FFDCC1; --no-bg:#FFDCC1; --no-line:#4C2700; --no-ink:#4C2700;
    --b-content:#F29A2E; --b-content-ink:#1E1000; --b-stressed:#79EAB9; --b-stressed-ink:#06281A; --b-low:#A866FF; --b-low-ink:#1D0038;
    --tab-on:#352F2B; --tab-on-ink:#FFB877; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.65);
    --deco:#FFB877; --deco-o:.17; --deco-img:url("butterfly.webp");
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#201B17; --surface:#2B2520; --surface-2:#352F2B; --ink:#ECE0DA; --ink-soft:#D6C3B6; --line:#51443A;
  --bar:#201B17; --on-bar:#FFB877; --rail:#201B17; --pill:#352F2B; --pill-ink:#ECE0DA;
  --accent:#FFB877; --on-accent:#4C2700; --bot:#FFB877; --bot-ink:#4C2700; --me:#51443A; --me-ink:#FFDCC1;
  --yes:#4C2700; --yes-ink:#FFDCC1; --no-bg:#FFDCC1; --no-line:#4C2700; --no-ink:#4C2700;
  --b-content:#F29A2E; --b-content-ink:#1E1000; --b-stressed:#79EAB9; --b-stressed-ink:#06281A; --b-low:#A866FF; --b-low-ink:#1D0038;
  --tab-on:#352F2B; --tab-on-ink:#FFB877; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.65);
  --deco:#FFB877; --deco-o:.17; --deco-img:url("butterfly.webp");
  color-scheme:dark;
}
/* the five wireframe themes, chosen in Settings → Look */
.app[data-look="orange"],.app[data-look="purple"],.app[data-look="mint"]{
  --bg:#E6E6E6; --surface:#FFFFFF; --surface-2:#F3F3F3; --ink:#020000; --ink-soft:#4B4B4B; --line:#D2D2D2;
  --bar:#E38100; --on-bar:#1E1000; --rail:#E38100; --pill:#FFFFFF; --pill-ink:#020000;
  --accent:#8100E3; --on-accent:#FFFFFF; --bot:#79EAB9; --bot-ink:#020000; --me:#FFFFFF; --me-ink:#020000;
  --yes:#8100E3; --yes-ink:#FFFFFF; --no-bg:#FFFFFF; --no-line:#8100E3; --no-ink:#020000;
  --b-content:#E38100; --b-content-ink:#1E1000; --b-stressed:#79EAB9; --b-stressed-ink:#06281A; --b-low:#8100E3; --b-low-ink:#FFFFFF;
  --tab-on:#FFFFFF; --tab-on-ink:#020000; --shadow:rgba(0,0,0,.10); --scrim:rgba(0,0,0,.45);
  --deco:#000000; --deco-o:0; --deco-img:none;
  color-scheme:light;
}
.app[data-look="purple"]{ --bar:#8100E3; --on-bar:#FFFFFF; --rail:#8100E3; }
.app[data-look="mint"]{ --bar:#79EAB9; --on-bar:#06281A; --rail:#79EAB9; --bot:#FFDCC1; --bot-ink:#2E1500; }
.app[data-look="night"]{
  --bg:#020000; --surface:#141414; --surface-2:#1F1F1F; --ink:#F4F4F4; --ink-soft:#B8B8B8; --line:#2E2E2E;
  --bar:#020000; --on-bar:#E38100; --rail:#020000; --pill:#1A1A1A; --pill-ink:#F4F4F4;
  --accent:#79EAB9; --on-accent:#06281A; --bot:#1A1A1A; --bot-ink:#E38100; --me:#262626; --me-ink:#FFFFFF;
  --yes:#79EAB9; --yes-ink:#06281A; --no-bg:#FFFFFF; --no-line:#79EAB9; --no-ink:#020000;
  --b-content:#E38100; --b-content-ink:#1E1000; --b-stressed:#79EAB9; --b-stressed-ink:#06281A; --b-low:#A866FF; --b-low-ink:#1D0038;
  --tab-on:#1F1F1F; --tab-on-ink:#E38100; --shadow:rgba(0,0,0,.6); --scrim:rgba(0,0,0,.7);
  --deco:#000000; --deco-o:0; --deco-img:none;
  color-scheme:dark;
}
.app[data-look="ember"]{
  --bg:#201B17; --surface:#2B2520; --surface-2:#352F2B; --ink:#ECE0DA; --ink-soft:#D6C3B6; --line:#51443A;
  --bar:#201B17; --on-bar:#FFB877; --rail:#201B17; --pill:#352F2B; --pill-ink:#ECE0DA;
  --accent:#FFB877; --on-accent:#4C2700; --bot:#FFB877; --bot-ink:#4C2700; --me:#51443A; --me-ink:#FFDCC1;
  --yes:#4C2700; --yes-ink:#FFDCC1; --no-bg:#FFDCC1; --no-line:#4C2700; --no-ink:#4C2700;
  --b-content:#F29A2E; --b-content-ink:#1E1000; --b-stressed:#79EAB9; --b-stressed-ink:#06281A; --b-low:#A866FF; --b-low-ink:#1D0038;
  --tab-on:#352F2B; --tab-on-ink:#FFB877; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.65);
  --deco:#FFB877; --deco-o:.17; --deco-img:url("butterfly.webp");
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls,.012em);word-spacing:var(--ws,.08em)}
.phone{width:100%;max-width:560px;height:100%;min-height:0;display:flex;flex-direction:column}

/* top bar (wireframe: 48px accent strip) */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:4px 18px;background:var(--bar);color:var(--on-bar)}
.brand{display:flex;align-items:center;gap:.35em;font:700 1.12em/1.1 var(--font-display);letter-spacing:.01em}
.brand .ico{font-size:28px}
.help-btn{display:inline-flex;align-items:center;gap:.3em;min-height:42px;padding:0 14px;border:0;border-radius:999px;background:var(--tab-on);color:var(--tab-on-ink);font-weight:700;font-size:.9em;cursor:pointer;box-shadow:0 3px 10px var(--shadow)}
.help-btn .ico{font-size:1.3em;line-height:1}
.ai-note{display:flex;align-items:center;gap:.45em;padding:4px 18px;background:var(--surface);color:var(--ink-soft);border-bottom:2px solid var(--line);font-size:min(.78em,15px);font-weight:700;line-height:1.35;letter-spacing:.012em;word-spacing:.08em}
.ai-note .ico{font-size:1.4em;line-height:1}
.ai-note .txt{flex:1;min-width:0}
.crisis{display:flex;flex-direction:column;gap:10px}
.crisis .emerg{display:flex;align-items:center;gap:.5em;padding:10px 14px;border-radius:var(--r-m);background:var(--danger);color:var(--on-danger);font-weight:700}
.crisis .emerg .num{font:700 1.5em/1.1 var(--font-display);user-select:all}
.crisis .line{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r-m);background:var(--surface-2)}
.crisis .line b{font-family:var(--font-display)}
.crisis .line .how{font-size:.85em;color:var(--ink-soft)}
.crisis .line .num{font:700 1.45em/1.2 var(--font-display);user-select:all;font-variant-numeric:tabular-nums}
.crisis .acts{display:flex;flex-wrap:wrap;gap:8px}
.crisis .acts a{display:inline-flex;align-items:center;gap:.3em;min-height:44px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none}
.fixes{display:flex;flex-direction:column;gap:8px}
.fix{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-s);background:rgba(255,255,255,.4)}
.fix .words{flex:1 1 10em;min-width:0;font-size:1.05em}
.fix .from{opacity:.7}
.fix .to{font-weight:700}
.fix .hint{display:block;font-size:.78em;opacity:.85}
.fix .btn{min-height:44px;padding:.2em .9em}
.fix .btn[aria-pressed="true"]{background:var(--bot-ink);color:var(--bot)}
select{min-height:48px;padding:.3em .8em;border:2px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);color:var(--ink);font:inherit}
.orig{margin:0;padding:.6em .9em;border-radius:var(--r-m);background:var(--surface-2);white-space:pre-wrap}
.help-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.help-list li{font-size:.95em;line-height:var(--lh)}
.help-list li .ico{font-size:1.35em;line-height:1;vertical-align:-.15em;margin-right:.15em}
#help-body .set p{font-size:.95em;color:var(--ink)}

/* rails (wireframe: 14px accent strips) + Ember's butterfly engraving */
.rails{position:relative;flex:1;min-height:0;display:flex;border-inline:14px solid var(--rail);background:var(--bg)}
.rails::before{content:"";position:absolute;inset:4% 6% 2%;background:var(--deco);-webkit-mask:var(--deco-img) center/contain no-repeat;mask:var(--deco-img) center/contain no-repeat;opacity:var(--deco-o);pointer-events:none}
.view{position:relative;z-index:1;flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 14px 28px}

/* chat */
.chat{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:flex-end;gap:10px;min-width:0}
.row.me{flex-direction:row-reverse}
.row.bot:has(+ .row.bot),.row.me:has(+ .row.me){margin-bottom:-8px}
.ava{flex:0 0 46px;width:46px;height:46px;display:grid;place-items:center;font-size:40px;line-height:1}
.row.bot:has(+ .row.bot) > .ava,.row.me:has(+ .row.me) > .ava{visibility:hidden}
.bubble{position:relative;padding:.7em 1em;border-radius:var(--r-m);background:var(--bot);color:var(--bot-ink);box-shadow:0 6px 18px var(--shadow);overflow-wrap:anywhere}
.row.bot .bubble{width:min(70%,21em)}
.app[data-wide="1"] .row.bot .bubble{width:min(86%,26em)}
.row.bot:not(:has(+ .row.bot)) .bubble{border-bottom-left-radius:6px}
.row.me .bubble{max-width:74%;background:var(--me);color:var(--me-ink)}
.row.me:not(:has(+ .row.me)) .bubble{border-bottom-right-radius:6px}
.bubble .lead{font-size:1.5em;line-height:1;vertical-align:-.12em;margin-right:.2em}
.bubble .txt .ico{font-size:1.3em;line-height:1;vertical-align:-.12em}
.row.bot .bubble:has(.yn){width:min(86%,22em)}
.bubble.reading{box-shadow:0 0 0 4px var(--accent),0 6px 18px var(--shadow)}
.speak{display:inline-grid;place-items:center;width:34px;height:34px;margin:-4px -6px -6px .25em;border:0;border-radius:50%;background:transparent;color:inherit;font-size:20px;vertical-align:middle;cursor:pointer;opacity:.75}
.speak:hover{opacity:1;background:rgba(127,127,127,.18)}
.yn{display:flex;flex-wrap:wrap;gap:10px;margin-top:.65em}
.yn button{display:inline-flex;align-items:center;justify-content:center;gap:.3em;min-width:84px;min-height:58px;padding:4px 14px;border-radius:999px;border:3px solid var(--no-line);background:var(--no-bg);color:var(--no-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 10px var(--shadow);transition:transform .12s}
.yn button.yes{background:var(--yes);border-color:var(--yes);color:var(--yes-ink)}
.yn button .lbl{font-size:15px;font-weight:700;letter-spacing:.02em}
.yn button:active{transform:scale(.95)}
.yn.done button{cursor:default;box-shadow:none}
.yn.done button:not(.picked){opacity:.35}
.answer{display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:78%}
.answer .emo{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 6px;line-height:1.08;font-size:var(--es,64px)}
.answer .cap{font-size:.78em;font-weight:700;color:var(--ink-soft);text-align:right;line-height:1.35}
.party{justify-content:center;gap:4px}
.party span{display:inline-block;font-size:clamp(48px,15vw,80px);line-height:1.1;animation:hop .6s cubic-bezier(.3,1.4,.5,1)}
.party span:nth-child(2){animation-delay:.08s}.party span:nth-child(3){animation-delay:.16s}.party span:nth-child(4){animation-delay:.24s}
.dots{display:flex;gap:7px;width:auto!important;padding:1em 1.1em}
.dots i{display:block;width:11px;height:11px;border-radius:50%;background:currentColor;animation:bob 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.row.in{animation:pop .22s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:translateY(10px) scale(.96)}to{transform:none}}
@keyframes hop{0%{transform:translateY(16px) scale(.5)}60%{transform:translateY(-10px) scale(1.08)}100%{transform:none}}

/* cards + tiles */
.card{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:var(--r-l);background:var(--surface);color:var(--ink);box-shadow:0 8px 24px var(--shadow)}
.card.done{opacity:.55;box-shadow:none}
.card-title{margin:0;font:600 1em/1.3 var(--font-display)}
.bands{display:flex;flex-direction:column;gap:12px}
.band{padding:10px;border-radius:var(--r-m);background:color-mix(in srgb,var(--b) 24%,var(--surface))}
[data-band="content"]{--b:var(--b-content);--b-ink:var(--b-content-ink)}
[data-band="stressed"]{--b:var(--b-stressed);--b-ink:var(--b-stressed-ink)}
[data-band="low"]{--b:var(--b-low);--b-ink:var(--b-low-ink)}
.band-name{display:inline-flex;margin:0 0 10px;padding:.15em .9em;border-radius:999px;background:var(--b);color:var(--b-ink);font:600 .88em/1.6 var(--font-display)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:104px;padding:12px 6px 10px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile .ico{font-size:44px;line-height:1}
.tile .lbl{font-size:.74em;font-weight:700;line-height:1.25;letter-spacing:0;word-spacing:0;text-align:center;overflow-wrap:break-word}
.tile .lbl.sm{font-size:.63em}
.tile[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent),0 10px 22px var(--shadow);transform:translateY(-3px)}
.tile[aria-pressed="true"]::after{content:"✔";position:absolute;top:6px;right:6px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;line-height:1}
.tile:active{transform:scale(.96)}
.band .tile{background:var(--surface)}
.tile.add{border:2px dashed var(--line);box-shadow:none;background:transparent}
.tile:disabled{cursor:default}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 14px;border:0;border-radius:var(--r-m);background:var(--surface);color:var(--ink);box-shadow:0 8px 22px var(--shadow);font-weight:700;font-size:.8em;line-height:1.25;text-align:center;cursor:pointer;transition:transform .12s}
.action .ico{font-size:44px;line-height:1}
.action:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:52px;padding:.3em 1.3em;border-radius:999px;border:3px solid var(--accent);background:transparent;color:var(--ink);font-weight:700;cursor:pointer;transition:transform .12s}
.btn .ico{font-size:1.35em;line-height:1}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--danger);background:var(--danger);color:var(--on-danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:.45em;min-height:46px;padding:.25em 1em;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.chip .ico{font-size:1.45em;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:700}
.adder-form{display:flex;flex-direction:column;gap:10px;padding:12px;border:2px dashed var(--line);border-radius:var(--r-m)}
.adder-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adder-line input.emo{flex:0 0 3.4em;text-align:center;font-size:1.5em;padding:.2em}
.adder-line input.word{flex:1 1 9em;min-width:0}
.err{margin:0;color:var(--danger);font-weight:700;font-size:.9em}
.err:empty{display:none}
textarea,input[type="text"]{width:100%;padding:.5em .8em;border:2px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);color:var(--ink);line-height:var(--lh)}
textarea{resize:vertical}
.note-line{display:flex;gap:8px;align-items:flex-start}
.note-line textarea,.note-line input{flex:1;min-width:0}
.todo-edit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo-edit li{display:flex;align-items:center;gap:8px;padding:.25em .25em .25em .9em;border-radius:var(--r-s);background:var(--surface-2)}
.todo-edit li span{flex:1;min-width:0;overflow-wrap:anywhere}
.icon-btn{display:inline-grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink);font-size:26px;cursor:pointer}

/* dock: big nav icons over the white input pill */
.dock{display:flex;flex-direction:column;gap:10px;padding:8px 14px 12px;background:var(--bar);color:var(--on-bar)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px 5px;border:0;border-radius:18px;background:transparent;color:var(--on-bar);font-size:13px;font-weight:700;line-height:1.3;cursor:pointer;transition:background .15s}
.tab .ico{font-size:34px;line-height:1.1}
.tab[aria-current="page"]{background:var(--tab-on);color:var(--tab-on-ink);box-shadow:0 4px 14px var(--shadow)}
.composer{margin:0}
.pill{display:flex;align-items:flex-end;gap:2px;min-height:56px;padding:5px 5px 5px 18px;border-radius:30px;background:var(--pill);color:var(--pill-ink);box-shadow:0 4px 14px var(--shadow)}
.pill:focus-within{box-shadow:0 0 0 3px var(--accent),0 4px 14px var(--shadow)}
.pill textarea{flex:1;min-width:0;max-height:7.6em;padding:.6em 0;border:0;border-radius:0;background:transparent;color:inherit;resize:none;outline:none}
.pill textarea::placeholder{color:var(--ink-soft);opacity:.85}
.ib{flex:0 0 46px;width:46px;height:46px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:inherit;font-size:30px;line-height:1;cursor:pointer}
.ib.send{background:var(--accent);color:var(--on-accent);font-size:22px}
.composer:not(.has-text):not(.busy) .ib.send{display:none}

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Follow the phone's Reduce motion setting live: no typing dots, pop-ins or celebrations when it is on.
let reduceMotion = false;
try { const mq = matchMedia('(prefers-reduced-motion: reduce)'); reduceMotion = mq.matches; mq.addEventListener('change', e => { reduceMotion = e.matches; }); } catch {}
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EMOJI_RE = /\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})*(?:‍\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier})*)*/gu;

const nextId = p => p + '-' + (++uid);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  return b;
}
function renderRich(text) { return esc(tone(text)).replace(EMOJI_RE, m => '<span class="ico">' + m + '</span>'); }

function stripEmoji(t) { return String(t).replace(EMOJI_RE, '').replace(/[\u{1F3FB}-\u{1F3FF}‍️]/gu, '').replace(/\s{2,}/g, ' ').trim(); }

function dayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDay(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
const countWords = s => (String(s || '').match(/[\p{L}\p{N}'’]+/gu) || []).length;

/* ---------- content from the Lexi board ---------- */
// Mood descriptors: the App Plan "Guided Categories" table. No "Happy" on purpose: Content is the goal.

/* ---------- safety + reply style (shared logic: docs/FEATURES_DO_NEXT.md §8–10) ---------- */
const RISK_PHRASES = ['kill myself','killing myself','kill my self','suicide','suicidal','end my life','end it all','take my life','want to die','wanna die','wish i was dead','wish i were dead','better off dead','better off without me','hang myself','self harm','hurt myself','hurting myself','harm myself','cut myself','cutting myself','dont want to live','no reason to live','unalive myself'];
const CHECK_PHRASES = ['want to disappear','cant go on','give up on everything','no point in anything','hopeless','worthless','hate my life','dead inside','overdose','nobody would care','cant do this anymore','dont want to be here'];
const RISK_TOKENS = ['kms','kys','unalive','sewerslide'];
const RISK_EMOJI = /[\u{1F52A}\u{1FA78}\u{26B0}\u{1FAA6}\u{1FAA2}]/u; // 🔪 🩸 ⚰ 🪦 🪢
function soundKey(s) {
  return String(s).toLowerCase()
    .replace(/\bd[yi]e\s+(my|your|his|her|their|the|it|this|that|a)\b/g, 'colour $1') // "dye my hair" is not "die"
    .replace(/[’']/g, '').replace(/[^a-z0-9\s]/g, ' ')
    .replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k')
    .replace(/z/g, 's').replace(/y/g, 'i').replace(/wh/g, 'w').replace(/kn/g, 'n')
    .replace(/([a-z])\1+/g, '$1').replace(/\s+/g, ' ').trim();
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
// phrase match: starts at a word start with the same first letter; exact prefix, or ~1 typo per 6 letters ending on a word end
function fuzzyHas(hay, starts, phrase) {
  const p = soundKey(phrase).replace(/ /g, '');
  const max = p.length >= 10 ? 2 : p.length >= 6 ? 1 : 0;
  const ends = new Set(starts.slice(1)); ends.add(hay.length);
  for (const i of starts) {
    if (hay[i] !== p[0]) continue;
    if (hay.startsWith(p, i)) return true;
    for (let len = p.length - max; max && len <= p.length + max; len++) {
      if (ends.has(i + len) && lev(hay.slice(i, i + len), p, max) <= max) return true;
    }
  }
  return false;
}
function riskCheck(text) {
  const raw = String(text || '');
  const key = soundKey(raw);
  const words = key ? key.split(' ') : [];
  if (words.some(w => RISK_TOKENS.includes(w))) return 'risk';
  let hay = ''; const starts = [];
  words.forEach(w => { starts.push(hay.length); hay += w; });
  if (RISK_PHRASES.some(p => fuzzyHas(hay, starts, p))) return 'risk';
  if (CHECK_PHRASES.some(p => fuzzyHas(hay, starts, p))) return 'check';
  if (RISK_EMOJI.test(raw) && words.length <= 4) return 'check';
  return 'none';
}
const LEVEL = { none: 0, check: 1, risk: 2 };
const maxLevel = (a, b) => (LEVEL[a] >= LEVEL[b] ? a : b);
const BANNED = ['hang in there','silver lining','bright side','everything happens for a reason','cheer up','be happy','stay positive','just be positive','good vibes','could be worse','piece of cake','every cloud','it is what it is','chin up','under the weather','beat yourself up','tough it out','man up','snap out of it'];
function styleCheck(text, { icons = true } = {}) {
  let tag = 'ok';
  const lines = cleanLines(text).map(l => l.replace(/^\[(ok|check|risk)\]\s*/i, (_, t) => { tag = t.toLowerCase(); return ''; })).filter(Boolean);
  let sentences = [];
  lines.forEach(l => (l.match(/[^.!?…]+(?:[.!?…]+["')\]]*)?/g) || [l]).map(s => s.trim()).filter(Boolean).forEach(s => {
    if (!stripEmoji(s) && sentences.length) sentences[sentences.length - 1] += ' ' + s; else sentences.push(s);
  }));
  const kept = sentences.filter(s => !BANNED.some(b => s.toLowerCase().includes(b)));
  if (kept.length) sentences = kept;
  const out = []; let count = 0;
  for (const s of sentences) {
    const w = stripEmoji(s).split(/\s+/).filter(Boolean).length;
    if (out.length === 3) break;
    if (count + w > 50) { if (!out.length) out.push(stripEmoji(s).split(/\s+/).slice(0, 50).join(' ') + '…'); break; }
    out.push(s); count += w;
  }
  const lines2 = out.map(s => {
    const emo = [...new Set(s.match(EMOJI_RE) || [])].slice(0, 2);
    const body = stripEmoji(s);
    return icons && emo.length ? body + ' ' + emo.join(' ') : body;
  }).filter(Boolean);
  return { tag, lines: lines2 };
}

const Store = {
  mode: 'loading', loaded: false, cloud: [], local: LS.get('lexi.entries', []) || [], subs: new Set(),
  profileRef: null, entriesCol: null, chains: {}
};
Store.ready = new Promise(r => { Store._ready = r; });
Store.all = () => [...Store.cloud, ...Store.local].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

Store.saveLocal = () => LS.set('lexi.entries', Store.local);
Store.newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
Store.chain = (id, fn) => (Store.chains[id] = (Store.chains[id] || Promise.resolve()).then(fn, fn));
Store.add = async entry => {
  await Store.ready;
  if (Store.mode === 'cloud') {
    const id = Store.newId('e');
    try { await Store.entriesCol.doc(id).set(entry); return { id, src: 'cloud' }; }
    catch (e) {
      console.warn('save failed', e);
      toast(e && e.code === 'quota_exceeded' ? 'Your journal is full. Delete old entries, then save again.' : 'Saved on this device only.');
    }
  }
  const id = Store.newId('l');
  Store.local.unshift({ ...entry, id, _src: 'local' });
  Store.saveLocal(); Store.emit();
  return { id, src: 'local' };
};
Store.update = (id, src, patch) => {
  if (src === 'cloud') return Store.chain(id, () => Store.entriesCol.doc(id).update(patch)).catch(e => { console.warn(e); toast("Couldn't save that change. Try again."); });
  const e = Store.local.find(x => x.id === id);
  if (e) { Object.assign(e, patch); Store.saveLocal(); Store.emit(); }
  return Promise.resolve();
};
Store.remove = (id, src) => {
  if (src === 'cloud') {
    Store.cloud = Store.cloud.filter(x => x.id !== id); Store.emit();
    return Store.chain(id, () => Store.entriesCol.doc(id).delete()).catch(e => { console.warn(e); toast("Couldn't delete that entry. Try again."); });
  }
  Store.local = Store.local.filter(x => x.id !== id); Store.saveLocal(); Store.emit();
  return Promise.resolve();
};

  if (/siri/.test(n)) s += 40;
  if (/google/.test(n)) s += 34;
  if (/online/.test(n)) s += 8;
  if (/samantha|ava|allison|susan|serena|daniel|karen|moira|tessa|zoe|evan|nathan|joelle|noelle/.test(n)) s += 12;

  (en.topics || []).forEach(tp => {
    const T = TOPIC_BY[tp.key]; const bits = [];
    if (tp.picks && tp.picks.length) bits.push(tp.picks.map(p => p.label).join(', '));
    if (tp.todos && tp.todos.length) bits.push(tp.todos.map(x => x.t + (x.done ? ' (done)' : '')).join(', '));

}

async function aiRisk(text) {
  if (!sampleFn || !sampleOk) return 'none';
  if (stripEmoji(text).split(/\s+/).filter(Boolean).length < 3) return 'none';
  try {
    const r = await sampleFn.json(
      'You check journal text for self-harm or suicide risk. The writer is dyslexic, so expect misspellings, sound-alike spellings and emoji. ' +
      'Reply with only JSON: {"level":"none"|"check"|"risk"}. "risk" = says they want to die, kill or hurt themselves, or has a plan. ' +
      '"check" = sounds hopeless, wants to disappear, or gives unclear dark hints. Otherwise "none".\n\nText:\n' + String(text).slice(0, 4000),
      { modelTier: 'quick' }

    return r && LEVEL[r.level] != null ? r.level : 'none';
  } catch (e) { if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) sampleErr(e); return 'none'; }
}
let safetyActive = false;
async function safetyFlow(level) {
  if (safetyActive || level === 'none') return;
  safetyActive = true;
  try {
    showView('home');
    if (level === 'risk') await riskSteps(true);
    else {
      await say('That sounds really hard. 💛');
      const safe = await ask('Are you safe right now?');
      if (safe) await say("Okay. I'm glad. I'm here if you want to talk.");

}

  await say('Your safety matters most right now.');
  await sayQueue; addCard(crisisCard());
  await say('Please talk to someone now. You can call or text these lines.');
  const safe = await ask('Are you safe right now?');
  if (safe) { await say("Thank you for telling me. I'm here if you want to talk."); await say('Tap Help at the top any time. 🆘'); }
  else { await say('Please call your local emergency number now. 🆘'); await sayQueue; addCard(crisisCard()); }
}

async function sendChat(text) {
  addMe(text);
  const local = riskCheck(text);
  if (local !== 'none') { await safetyFlow(local); return; }
  if (!sampleFn || !sampleOk) {
    const r = fallbackReply(text);
    if (r) await sayMany(r);
    else { await sayMany(["I can't chat freely right now. 🔌", 'You can still do a check-in or write on your own.']); await sayQueue; offerActions(); }
    return;
  }
  turns.push({ role: 'user', content: text });
  if (turns.length > 16) turns = turns.slice(-16);
  while (turns.length && turns[0].role !== 'user') turns.shift();
  await sayQueue;
  const ctl = new AbortController(); chatCtl = ctl; setSending(true);
  const typing = showTyping();
  let started = false, rows = [];
  const drawLines = lines => {
    lines.forEach((l, i) => {
      if (rows[i] && rows[i].dataset.line === l) return;
      const nr = botRow(l).r; nr.dataset.line = l;
      if (rows[i]) { nr.classList.remove('in'); rows[i].replaceWith(nr); } else typing.before(nr);
      rows[i] = nr;
    });
    rows.splice(lines.length).forEach(x => x.remove());
  };
  // while streaming: raw lines with the safety tag hidden; when done: the style-checked lines
  const draw = txt => drawLines(cleanLines(txt).map(l => l.replace(/^\[(ok|check|risk)\]\s*/i, '')).filter(l => l && !/^\[[a-z]*\]?$/i.test(l)));
  let level = 'none';
  try {
    const res = await sampleFn([{ role: 'user', content: lexiRules() }, ...turns], {
      cache: false, modelTier: 'quick', signal: ctl.signal,
      onText: ({ text: t }) => { if (!started) { started = true; typing.hidden = true; } draw(t); scrollDown(); }
    });
    const checked = styleCheck(res.text, { icons: profile.settings.icons });
    level = LEVEL[checked.tag] != null ? checked.tag : 'none';
    drawLines(checked.lines);
    typing.remove();
    turns.push({ role: 'assistant', content: '[' + checked.tag + ']\n' + checked.lines.join('\n') });
    if (profile.settings.autoread) rows.forEach(r => { const b = $('.bubble', r); speak($('.txt', r).dataset.raw, { el: b, queue: true }); });
    if (res.truncated) addBot('That got cut short. Ask me for less at a time. ✂️', { info: true });
  } catch (e) {
    typing.remove();
    if (e && e.code === 'refused') rows.forEach(x => x.remove());
    const m = sampleErr(e); if (m) addBot(m, { info: true });
  } finally {
    if (chatCtl === ctl) { chatCtl = null; setSending(false); }
    scrollDown();
  }
  if (level !== 'none') await safetyFlow(level);
}

    Object.entries(LETTERS).map(([k, [n, ls, ws]]) => seg('letters', k, '<span style="letter-spacing:' + ls + ';word-spacing:' + ws + '">' + esc(n) + '</span>')).join('') + '</div></section>';
  h += '<section class="set"><h3>' + renderRich('↕️') + ' Line spacing</h3><p>Wider gaps between lines can make reading easier.</p><div class="chips">' + Object.entries(SPACING).map(([k, [n]]) => seg('spacing', k, esc(n))).join('') + '</div></section>';
  h += '<section class="set"><h3>' + renderRich('✋🏽') + ' Skin tone</h3><div class="chips">' + TONES.map(([t, n]) => seg('tone', t, '<span style="font-size:1.6em;line-height:1" aria-hidden="true">✋' + t + '</span> ' + esc(n))).join('') + '</div></section>';
  h += '<section class="set"><h3>' + renderRich(S.avatar) + ' My avatar</h3><div class="chips">' + AVATARS.map(a => seg('avatar', a, '<span style="font-size:1.9em;line-height:1">' + esc(tone(a)) + '</span>', ' aria-label="Avatar ' + esc(a) + '"')).join('') + '</div></section>';
  const customs = [];
  (profile.custom.mood || []).forEach((m, i) => customs.push(['mood', i, m]));
  TOPICS.forEach(t => (profile.custom[t.key] || []).forEach((m, i) => customs.push([t.key, i, m])));
  h += '<section class="set"><h3>' + renderRich('🏷️') + ' My own words</h3>' + (customs.length
    ? '<p>Words and emoji you added. Tap ✖️ to remove one.</p><ul class="customs">' + customs.map(([g, i, m]) => '<li data-band="' + esc(m.band || '') + '">' + renderRich(m.e) + ' ' + esc(m.label) + '<button type="button" data-act="rm-custom" data-g="' + esc(g) + '" data-i="' + i + '" aria-label="Remove ' + esc(m.label) + '">✖️</button></li>').join('') + '</ul>'
    : '<p>Add your own feeling words with ➕ My own during a check-in.</p>') + '</section>';
  h += '<section class="set"><h3>' + renderRich('📊') + ' Journal numbers</h3><p>Your journal shows days journaled and feelings named. You can also show a streak (rest days are OK) and a word count.</p><div class="chips">' +
    seg('showStreak', false, 'Keep it simple') + seg('showStreak', true, 'Show streak and word count') + '</div></section>';
  h += '<section class="set"><h3>' + renderRich('🔒') + ' Your privacy</h3><ul class="help-list">' + privacyLines().map(l => '<li>' + renderRich(l) + '</li>').join('') + '</ul>' +
    '<div class="chips"><button type="button" class="chip" data-act="read-privacy">' + renderRich('🔊') + ' Read this</button><button type="button" class="chip" data-help>' + renderRich('🆘') + ' Help and safety</button></div></section>';
  h += '<section class="set"><h3>' + renderRich('💾') + ' Your journal</h3><p>' + (Store.mode === 'cloud' ? 'Private to you and saved to your account.' : Store.mode === 'local' ? 'Saved on this device only.' : 'Connecting…') + '</p><div class="chips">' +
    '<button type="button" class="chip" data-act="replay">' + renderRich('🔁') + ' Replay Lexi\'s intro</button>' +
    '<button type="button" class="chip" data-act="wipe">' + renderRich('🗑️') + ' Delete all entries</button></div>' +
    (wipeAsk ? '<div class="confirm"><p>Delete all ' + Store.all().length + ' entries? This can\'t be undone.</p><button type="button" class="btn" data-act="wipe-no">Keep them</button><button type="button" class="btn danger" data-act="wipe-yes">Delete all</button></div>' : '') + '</section>';
  const top = sv.scrollTop;
  sv.innerHTML = h;
  sv.scrollTop = top;
}
sv.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('help' in b.dataset) { openHelp(); return; }
  if (b.dataset.act === 'read-privacy') { privacyLines().forEach((l, i) => speak(l, { queue: i > 0 })); return; }
  if (b.dataset.set) {
    const k = b.dataset.set; let v = b.dataset.val;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    profile.settings[k] = v; applySettings(); saveProfile(); autosize();
    if (k === 'tone' || k === 'avatar') retone();
    renderSettings(); if (!jv.hidden) renderJournal();
    const again = $('[data-set="' + k + '"][aria-pressed="true"]', sv); if (again) again.focus({ preventScroll: true });
    if (k === 'lexiVoice') speak(v === 'device' ? "Hi! I'm Lexi. I'll read with you." : "Hi! I'm Lexi. I'm here to make journaling easy and fun.");
    return;
  }
  if (b.dataset.voice) {
    profile.settings.voice = b.dataset.voice; saveProfile(); renderSettings();
    const v = voices.find(x => x.voiceURI === b.dataset.voice);
    speak("Hi! I'm Lexi. I'll read with you.", { voice: v });
    const again = $('[data-voice="' + CSS.escape(b.dataset.voice) + '"]', sv); if (again) again.focus({ preventScroll: true });
    return;
  }
  if (b.dataset.play) { const v = voices.find(x => x.voiceURI === b.dataset.play); speak("Hi! I'm Lexi. I'm here to make journaling easy and fun.", { voice: v }); return; }
  const act = b.dataset.act;
  if (act === 'allvoices') { showAllVoices = !showAllVoices; renderSettings(); return; }
  if (act === 'testvoice') { speak("Hi! I'm Lexi, the journaling chatbot. I'm here to make journaling easy and fun."); return; }
  if (act === 'rm-custom') { const g = b.dataset.g, i = +b.dataset.i; (profile.custom[g] || []).splice(i, 1); saveProfile(); renderSettings(); return; }
  if (act === 'replay') { showView('home'); intro(); return; }
  if (act === 'wipe') { wipeAsk = true; renderSettings(); return; }
  if (act === 'wipe-no') { wipeAsk = false; renderSettings(); return; }
  if (act === 'wipe-yes') {
    wipeAsk = false; renderSettings();
    for (const en of Store.all()) await Store.remove(en.id, en._src);
    toast('All entries deleted. 🗑️');
  }
});
sv.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'set-rate') { profile.settings.rate = +t.value; $('#out-rate').textContent = (+t.value).toFixed(2) + '×'; }
  if (t.id === 'set-pitch') { profile.settings.pitch = +t.value; $('#out-pitch').textContent = (+t.value).toFixed(2); }
});
sv.addEventListener('change', e => {
  if (e.target.id === 'set-rate') { saveProfile(); speak('This is how I sound now.'); }
  if (e.target.id === 'set-pitch') { saveProfile(); speak('This is how I sound now.', { voice: currentVoice() }); }
});
function retone() {
  $$('[data-raw]').forEach(n => { n.innerHTML = renderRich(n.dataset.raw); });
  $$('.me-ava').forEach(n => rich(n, profile.settings.avatar));
}

/* ---------- help sheet: help lines, how to, how Lexi keeps you safe, privacy (docs/FEATURES_DO_NEXT.md §6, §13) ---------- */
const HELP_NOW = 'If you might hurt yourself, or you are in danger, call your local emergency number now.';
const HELP_TIPS = ['🧭 Check in: tap Guided check-in and pick emoji.', "✏️ Write: tap Write on my own. Spelling doesn't matter.", '🔊 Listen: tap the speaker on any message.', '📖 Journal: see your days and your entries.', '⚙️ Settings: change text size, spacing, colors and voice.'];
const SAFETY_TEXT = "Lexi looks for words about wanting to die or hurting yourself, even when they are spelled in a different way or written with emoji. If it finds them, it shows you help lines. When Lexi's chat brain is on, Claude checks too. Lexi can make mistakes, so if you need help, please use the help lines.";
function privacyLines() {
  return [
    '🔒 Your journal is private. Only you can see it.',
    Store.mode === 'local' ? '💾 It is saved on this device only.' : '💾 It is saved to your Claude account, so it is there on your other devices.',
    '🤖 When you chat with me, tidy your spelling, or ask for a reflection, your words go to Claude, an AI made by Anthropic, to make a reply.',
    "🛟 If you write about hurting yourself, I show you help lines. I can't call anyone, and nobody is told.",
    '🗑️ You can delete one entry, or everything, in Settings.'
  ];
}
const helpSheet = $('#help');
let helpFocus = null;
function helpSection(title, kids, texts) {
  const s = el('section', 'set');
  const h = el('h3'); rich(h, title); s.append(h, ...kids);
  if (texts && texts.some(canRead)) { const b = button('chip', 'Read this', '🔊'); b.onclick = () => texts.forEach((t, i) => speak(t, { queue: i > 0 })); s.append(b); }
  return s;
}
function listOf(lines) { const ul = el('ul', 'help-list'); lines.forEach(l => { const li = el('li'); rich(li, l); ul.append(li); }); return ul; }
function renderHelp() {
  const sel = el('select'); sel.id = 'help-country';
  Object.entries(CRISIS).forEach(([k, v]) => { const o = el('option', '', v.name); o.value = k; o.selected = k === country(); sel.append(o); });
  sel.onchange = () => { profile.settings.country = sel.value; saveProfile(); renderHelp(); $('#help-country').focus(); };
  const lab = el('label', 'card-title', 'Your country'); lab.htmlFor = 'help-country';
  const pick = el('div', 'adder-line'); pick.append(lab, sel);
  const now = el('p'); now.style.cssText = 'font-size:1em;color:var(--ink);font-weight:700'; rich(now, HELP_NOW);
  $('#help-body').replaceChildren(
    helpSection('🛟 Need help now?', [now, crisisCard({ change: false }), pick], [HELP_NOW]),
    helpSection('🧭 How to use Lexi', [listOf(HELP_TIPS)], HELP_TIPS),
    helpSection('🛡️ How Lexi keeps you safe', [rich(el('p'), SAFETY_TEXT)], [SAFETY_TEXT]),
    helpSection('🔒 Your privacy', [listOf(privacyLines())], privacyLines())
  );
}
function openHelp() {
  helpFocus = document.activeElement; pop.hidden = true;
  renderHelp(); helpSheet.hidden = false;
  setTimeout(() => $('#help-close').focus(), 30);
}
function closeHelp() { helpSheet.hidden = true; stopSpeaking(); if (helpFocus && helpFocus.focus) helpFocus.focus({ preventScroll: true }); }
$('#help-close').onclick = closeHelp;
document.addEventListener('click', e => { const b = e.target.closest('[data-help]'); if (b && !sv.contains(b)) openHelp(); });

/* ---------- composer ---------- */
function autosize() {
  msg.style.height = 'auto';
  const h = msg.scrollHeight + 2, max = Math.round(parseFloat(getComputedStyle(msg).lineHeight) * 4.5) || 160;
  msg.style.height = Math.min(h, max) + 'px'; msg.style.overflowY = h > max ? 'auto' : 'hidden';
  form.classList.toggle('has-text', !!msg.value.trim());
}
msg.addEventListener('input', autosize);
msg.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
form.addEventListener('submit', e => {
  e.preventDefault();
  if (chatCtl) { chatCtl.abort(); return; }
  const v = msg.value.trim(); if (!v) return;
  msg.value = ''; autosize(); pop.hidden = true;
  sendChat(v);
});
$('#msg-emoji').onclick = () => { if (!pop.hidden && emojiTarget === msg) { pop.hidden = true; return; } openEmoji(msg); };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!pop.hidden) { pop.hidden = true; return; }
  if (!helpSheet.hidden) { closeHelp(); return; }
  if (!sheet.hidden) closeSheet();
});

/* ---------- boot ---------- */
{ const an = $('#ai-note'); const sb = speakBtn('🤖 Lexi is an AI, not a person or a therapist.', an); if (sb) an.append(sb); }
applySettings(); updateAIUi(); renderSettings(); renderJournal(); autosize();
Store.subs.add(() => { if (!sv.hidden) renderSettings(); });
initStore(); initSample();
if (location.hash === '#journal') showView('journal'); else if (location.hash === '#settings') showView('settings');
(async () => {
  const t = showTyping();
  await Promise.race([Store.ready, sleep(2500)]);
  t.remove();
  if (profile.onboarded) welcomeBack(); else intro();
})();
})();
</script>
