<title>Lexi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Warm paper (docs/DESIGN_WARM_PAPER.md): warm canvas, no accent frame, one accent per screen,
   big type, Lexend 400/500/600 for the interface. Default tokens are Cream; dark falls back to Ember. */
:root,.app[data-look="cream"]{
  --canvas:#F6EEE2; --surface:#FFFBF5; --sunken:#EFE5D6; --raised:#FFFBF5; --lexi:#FBE2C4; --lexi-edge:transparent; --me:#FFFBF5; --me-edge:#E3D6C4;
  --ink:#17130F; --muted:#4E443B; --accent:#9C4A0B; --on-accent:#FFFBF5; --accent-ink:#9C4A0B; --accent-tint:#F3E6D9;
  --edge:#8C7F70; --hairline:#E3D6C4; --hl-look:#79EAB9; --sh:23 19 15;
  --elev:0 1px 2px rgb(var(--sh) / 6%),0 4px 12px rgb(var(--sh) / 6%); --elev-over:0 2px 6px rgb(var(--sh) / 8%),0 12px 32px rgb(var(--sh) / 12%);
  --dock-sh:0 -4px 12px rgb(var(--sh) / 5%); --scrim:rgb(23 19 15 / 45%); --wing1:#E38100; --wing2:#F2B36B;
  --bc-soft:#FAE1C0; --bc-ink:#6E3A08; --bc-solid:#C26A06; --bs-soft:#D2EEE2; --bs-ink:#1B5A45; --bs-solid:#2A8A69; --bl-soft:#E6DDF4; --bl-ink:#4B2C80; --bl-solid:#7A4FC4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#201B17; --surface:#2B2520; --sunken:#1A1612; --raised:#352F2B; --lexi:#3A2F27; --lexi-edge:transparent; --me:#4A3A2C; --me-edge:transparent;
    --ink:#F0E5DE; --muted:#E2D2C6; --accent:#FFB877; --on-accent:#4C2700; --accent-ink:#FFB877; --accent-tint:#443729;
    --edge:#9E8E82; --hairline:#44392F; --hl-look:#FFE36E; --sh:0 0 0;
    --elev:none; --elev-over:0 0 0 1px #9E8E82,0 12px 32px rgb(0 0 0 / 35%); --dock-sh:none; --scrim:rgb(0 0 0 / 60%); --wing1:#F29A2E; --wing2:#FFC98F;
    --bc-soft:#4A3418; --bc-ink:#F7D3A6; --bc-solid:#E8963A; --bs-soft:#1E3F35; --bs-ink:#BDEBD8; --bs-solid:#4FC49A; --bl-soft:#352A4D; --bl-ink:#DCCCF7; --bl-solid:#A98BEA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"],.app[data-look="ember"]{
  --canvas:#201B17; --surface:#2B2520; --sunken:#1A1612; --raised:#352F2B; --lexi:#3A2F27; --lexi-edge:transparent; --me:#4A3A2C; --me-edge:transparent;
  --ink:#F0E5DE; --muted:#E2D2C6; --accent:#FFB877; --on-accent:#4C2700; --accent-ink:#FFB877; --accent-tint:#443729;
  --edge:#9E8E82; --hairline:#44392F; --hl-look:#FFE36E; --sh:0 0 0;
  --elev:none; --elev-over:0 0 0 1px #9E8E82,0 12px 32px rgb(0 0 0 / 35%); --dock-sh:none; --scrim:rgb(0 0 0 / 60%); --wing1:#F29A2E; --wing2:#FFC98F;
  --bc-soft:#4A3418; --bc-ink:#F7D3A6; --bc-solid:#E8963A; --bs-soft:#1E3F35; --bs-ink:#BDEBD8; --bs-solid:#4FC49A; --bl-soft:#352A4D; --bl-ink:#DCCCF7; --bl-solid:#A98BEA;
  color-scheme:dark;
}
/* light looks share the light shadows and mood bands */
.app[data-look="orange"],.app[data-look="purple"],.app[data-look="mint"]{
  --elev:0 1px 2px rgb(var(--sh) / 6%),0 4px 12px rgb(var(--sh) / 6%); --elev-over:0 2px 6px rgb(var(--sh) / 8%),0 12px 32px rgb(var(--sh) / 12%);
  --dock-sh:0 -4px 12px rgb(var(--sh) / 5%); --wing1:#E38100; --wing2:#F2B36B; --hl-look:#FFE36E; --lexi-edge:transparent;
  --bc-soft:#FAE1C0; --bc-ink:#6E3A08; --bc-solid:#C26A06; --bs-soft:#D2EEE2; --bs-ink:#1B5A45; --bs-solid:#2A8A69; --bl-soft:#E6DDF4; --bl-ink:#4B2C80; --bl-solid:#7A4FC4;
  color-scheme:light;
}
.app[data-look="orange"]{ /* shown as Peach */
  --canvas:#F9E3CC; --surface:#FFF9F2; --sunken:#F3DDC6; --raised:#FFF9F2; --lexi:#FFF9F2; --lexi-edge:#EBCDB0; --me:#FFF9F2; --me-edge:#EBCDB0;
  --ink:#2A1C12; --muted:#5E4335; --accent:#A3480A; --on-accent:#FFF9F2; --accent-ink:#93410A; --accent-tint:#F4E4D6;
  --edge:#957360; --hairline:#EBCDB0; --sh:42 28 18; --scrim:rgb(42 28 18 / 45%);
}
.app[data-look="purple"]{
  --canvas:#F5F0F8; --surface:#FFFCFF; --sunken:#ECE6F1; --raised:#FFFCFF; --lexi:#FFFCF8; --lexi-edge:#E3DAEC; --me:#ECE2F8; --me-edge:transparent;
  --ink:#221A2E; --muted:#574A6B; --accent:#6E3BC4; --on-accent:#FFFFFF; --accent-ink:#6630BB; --accent-tint:#EEE5F8;
  --edge:#857A97; --hairline:#E3DAEC; --sh:34 26 46; --scrim:rgb(34 26 46 / 45%);
}
.app[data-look="mint"]{
  --canvas:#EEF5EC; --surface:#FBFDF8; --sunken:#E4EDE2; --raised:#FBFDF8; --lexi:#FCFCF6; --lexi-edge:#D5E4D7; --me:#D8EEE0; --me-edge:transparent;
  --ink:#13261D; --muted:#3A5346; --accent:#1F7A57; --on-accent:#FFFFFF; --accent-ink:#1A6A4C; --accent-tint:#E1EDE5;
  --edge:#6F877A; --hairline:#D5E4D7; --sh:19 38 29; --scrim:rgb(19 38 29 / 45%);
}
.app[data-look="night"]{
  --canvas:#17181D; --surface:#1F2027; --sunken:#121317; --raised:#272932; --lexi:#2A2B33; --lexi-edge:transparent; --me:#3A3326; --me-edge:transparent;
  --ink:#ECE7DF; --muted:#DDD7CE; --accent:#F2A65A; --on-accent:#1E1408; --accent-ink:#F6B97A; --accent-tint:#38302D;
  --edge:#7C7A82; --hairline:#2E3038; --hl-look:#FFE36E; --sh:0 0 0;
  --elev:none; --elev-over:0 0 0 1px #7C7A82,0 12px 32px rgb(0 0 0 / 35%); --dock-sh:none; --scrim:rgb(0 0 0 / 60%); --wing1:#F29A2E; --wing2:#FFC98F;
  --bc-soft:#4A3418; --bc-ink:#F7D3A6; --bc-solid:#E8963A; --bs-soft:#1E3F35; --bs-ink:#BDEBD8; --bs-solid:#4FC49A; --bl-soft:#352A4D; --bl-ink:#DCCCF7; --bl-solid:#A98BEA;
  color-scheme:dark;
}
:root{
  --danger:#B42F1F; --on-danger:#FFFBF5;
  --font:Verdana,"Atkinson Hyperlegible","DejaVu Sans",Tahoma,sans-serif;
  --font-display:"Lexend",Verdana,"DejaVu Sans",sans-serif;
  --fs:18px; --lh:1.7;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px;
  --cap:max(16px,.889em);
}
/* older names, kept so inline styles and helpers keep working */
.app{--bg:var(--canvas); --surface-2:var(--sunken); --ink-soft:var(--muted); --line:var(--hairline); --bot:var(--lexi); --bot-ink:var(--ink); --me-ink:var(--ink); --shadow:rgb(var(--sh) / 10%)}
[data-band="content"]{--b:var(--bc-solid);--b-soft:var(--bc-soft);--b-ink:var(--bc-ink)}
[data-band="stressed"]{--b:var(--bs-solid);--b-soft:var(--bs-soft);--b-ink:var(--bs-ink)}
[data-band="low"]{--b:var(--bl-solid);--b-soft:var(--bl-soft);--b-ink:var(--bl-ink)}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{height:100%;display:flex;justify-content:center;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls,.012em);word-spacing:var(--ws,.08em)}
.phone{width:100%;max-width:560px;height:100%;min-height:0;display:flex;flex-direction:column}

/* line icons and the butterfly mark */
.li{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ico:has(> .li){display:inline-grid;place-items:center;line-height:1}
.mark{flex:none;display:block}
.mark .w1{fill:var(--wing1)} .mark .w2{fill:var(--wing2)} .mark .bd{fill:var(--ink)} .mark .an{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.mark .wings{transform-box:view-box;transform-origin:50% 50%;transition:transform .35s cubic-bezier(.2,0,0,1)}
.mark.think .wings{transform:scaleX(.78)}
.shape{width:20px;height:20px;flex:none;fill:var(--b,var(--muted))}

/* top bar: canvas colour, the butterfly, Help */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:8px 20px 4px;background:var(--canvas);color:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font:600 1.222em/1.2 var(--font-display)}
.brand .mark{width:34px;height:34px}
.help-btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 14px;border:1px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--ink);font:500 1em/1 var(--font-display);cursor:pointer}
.ai-note{display:flex;align-items:center;gap:6px;padding:0 14px 6px 20px;color:var(--muted);font:500 var(--cap)/1.45 var(--font-display)}
.ai-note .txt{flex:1;min-width:0}
.ai-note .speak{width:44px;height:44px;border:0;background:transparent}
.crisis{display:flex;flex-direction:column;gap:10px}
.crisis .emerg{display:flex;align-items:center;gap:.5em;padding:12px 14px;border-radius:var(--r-lg);background:var(--danger);color:var(--on-danger);font:600 1em/1.3 var(--font-display)}
.crisis .emerg .num{font:600 1.5em/1.1 var(--font-display);user-select:all}
.crisis .line{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-lg);background:var(--sunken)}
.crisis .line b{font-family:var(--font-display);font-weight:600}
.crisis .line .how{font:500 var(--cap)/1.45 var(--font-display);color:var(--muted)}
.crisis .line .num{font:600 1.45em/1.2 var(--font-display);user-select:all;font-variant-numeric:tabular-nums}
.crisis .acts{display:flex;flex-wrap:wrap;gap:8px}
.crisis .acts a{display:inline-flex;align-items:center;gap:.4em;min-height:48px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 1em/1 var(--font-display);text-decoration:none}
.fixes{display:flex;flex-direction:column;gap:8px}
.fix{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface)}
.fix .words{flex:1 1 10em;min-width:0;font-size:1.05em}
.fix .from{color:var(--muted)}
.fix .to{font-weight:700}
.fix .hint{display:block;font:500 var(--cap)/1.45 var(--font-display);color:var(--muted)}
.fix .btn{min-height:48px;padding:.2em 1em}
.fix .btn[aria-pressed="true"]{background:var(--accent-tint);border:2px solid var(--accent-ink);font-weight:600}
select{min-height:48px;padding:.3em .8em;border:1px solid var(--edge);border-radius:var(--r-md);background:var(--sunken);color:var(--ink);font:inherit}
.orig{margin:0;padding:.7em 1em;border-radius:var(--r-lg);background:var(--sunken);white-space:pre-wrap}
.w{border-radius:var(--r-xs);transition:background-color .08s}
.w.hl,.w.tapped{background:var(--hl);color:#17130F;box-shadow:0 0 0 2px var(--hl)}
.app[data-tapword="1"] .bubble .w,.app[data-tapword="1"] .entry .text .w{cursor:pointer}
.next-row{justify-content:flex-start;padding-left:46px}
.next-pill{display:inline-flex;align-items:center;gap:.4em;min-height:48px;padding:0 1.3em;border:1px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--ink);font:600 1em/1 var(--font-display);cursor:pointer}
.next-pill .ico{font-size:1.1em}
.newmsg{position:fixed;z-index:15;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 14px;border:1px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--ink);font:500 var(--cap)/1 var(--font-display);box-shadow:var(--elev-over);cursor:pointer}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:500 var(--cap)/1.3 var(--font-display);color:var(--muted)}
.steps .dots2{display:flex;gap:6px}
.steps .dots2 i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid var(--edge);background:transparent}
.steps .dots2 i.done{background:var(--accent-ink);border-color:var(--accent-ink)}
.steps .dots2 i.now{background:var(--accent-ink);border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-tint)}
.recap{display:flex;flex-direction:column;gap:10px}
.recap .item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r-lg);background:var(--sunken)}
.recap .item .what{flex:1;min-width:0}
.recap .item b{display:block;font:600 1em/1.4 var(--font-display)}
.qs-row{display:flex;flex-direction:column;gap:6px}
.qs-row h4{margin:0;font:600 1em/1.3 var(--font-display)}
.qs-preview{align-self:flex-start}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.alt{display:block;font:500 var(--cap)/1.45 var(--font-display);color:var(--muted)}
.help-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.help-list li{font-size:max(16px,.95em);line-height:var(--lh)}
.help-list li .ico{font-size:1.35em;line-height:1;vertical-align:-.15em;margin-right:.15em}
#help-body .set p{font-size:max(16px,.95em);color:var(--ink)}

.rails{position:relative;flex:1;min-height:0;display:flex;background:var(--canvas)}
.view{position:relative;z-index:1;flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 20px 28px}

/* chat */
.chat{display:flex;flex-direction:column;gap:24px}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.row.me{flex-direction:row-reverse;align-items:flex-end}
.row.bot + .row.bot,.row.me + .row.me{margin-top:-16px}
.ava{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;margin-top:4px;line-height:1}
.ava .mark{width:36px;height:36px}
.me-ava{font-size:30px;margin-top:0}
.row.bot + .row.bot > .ava,.row.me + .row.me > .ava{visibility:hidden}
.bubble{position:relative;padding:.75em 1em;border:1px solid var(--lexi-edge);border-radius:var(--r-lg);background:var(--lexi);color:var(--ink);overflow-wrap:break-word}
.row.bot .bubble{width:min(calc(100% - 104px),21em)}
.app[data-wide="1"] .row.bot .bubble{width:min(calc(100% - 104px),26em)}
.row.bot:not(:has(+ .row.bot)) .bubble{border-bottom-left-radius:var(--r-xs)}
.row.me .bubble{max-width:74%;border-color:var(--me-edge);background:var(--me);color:var(--ink)}
.row.me:not(:has(+ .row.me)) .bubble{border-bottom-right-radius:var(--r-xs)}
.bubble .lead{font-size:1.5em;line-height:1;vertical-align:-.12em;margin-right:.2em}
.bubble .txt .ico{font-size:1.3em;line-height:1;vertical-align:-.12em}
.row.bot .bubble:has(.yn){width:min(calc(100% - 104px),22em)}
.bubble.reading{box-shadow:0 0 0 2px var(--accent-ink)}
.speak{display:inline-grid;place-items:center;flex:none;align-self:flex-end;width:48px;height:48px;padding:0;border:1px solid var(--hairline);border-radius:50%;background:var(--surface);color:var(--ink);cursor:pointer}
.speak:hover{border-color:var(--edge)}
.row.typing .think{display:flex;align-items:center;min-height:44px;color:var(--muted);font:500 var(--cap)/1.45 var(--font-display)}
.yn{display:flex;flex-wrap:wrap;gap:10px;margin-top:.7em}
.yn button{display:inline-flex;align-items:center;justify-content:center;gap:.3em;min-width:84px;min-height:56px;padding:4px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--ink);font:500 1em/1 var(--font-display);cursor:pointer;transition:background-color .15s}
.yn button .ico{font-size:1.4em;line-height:1}
.yn button.yes{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.answer{display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:78%}
.answer .emo{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 6px;line-height:1.08;font-size:var(--es,64px)}
.answer .cap{font:500 var(--cap)/1.45 var(--font-display);color:var(--muted);text-align:right}
.row.in{animation:rise .25s cubic-bezier(.2,0,0,1)}
@keyframes rise{from{transform:translateY(4px)}to{transform:none}}

/* home: welcome, one primary action, this week */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 2px;text-align:center}
.hero .halo{width:148px;height:148px;display:grid;place-items:center;border:1px solid var(--lexi-edge);border-radius:50%;background:var(--lexi)}
.hero .halo .mark{width:104px;height:104px}
.hero h2{margin:0;font:600 2em/1.2 var(--font-display)}
.home-actions{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.btn.wide{width:100%;justify-content:flex-start;padding:0 20px;text-align:left}
.btn.wide .grow{flex:1}
.btn.hero-btn{min-height:64px;font-size:1.111em}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7em),1fr));gap:10px;flex:1;min-width:0}
.week{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--hairline);border-radius:var(--r-xl);background:var(--raised);box-shadow:var(--elev)}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.week-head h3{margin:0;font:600 1em/1.3 var(--font-display)}
.week-head span{font:500 var(--cap)/1.3 var(--font-display);color:var(--muted)}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font:500 min(var(--cap),19px)/1.2 var(--font-display);color:var(--muted)}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk .mk{display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
.wk .shape{width:24px;height:24px}
.wk .ring{width:22px;height:22px;border:2px dashed var(--edge);border-radius:50%}
.wk .dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.wk.today{color:var(--ink);font-weight:600}
.wk.today .mk{box-shadow:0 0 0 2px var(--accent-ink)}

/* cards + tiles */
.card{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--hairline);border-radius:var(--r-xl);background:var(--raised);color:var(--ink);box-shadow:var(--elev)}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.card-title{margin:0;font:600 1.222em/1.3 var(--font-display)}
.bands{display:flex;flex-direction:column;gap:14px}
.band{display:flex;flex-direction:column;gap:10px}
.band-name{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;margin:0;padding:6px 14px 6px 10px;border-radius:999px;background:var(--b-soft);color:var(--b-ink);font:600 var(--cap)/1.3 var(--font-display)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,5.5em),1fr));gap:4px;padding:4px;border-radius:var(--r-lg);background:var(--sunken)}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:6px 4px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:500 var(--cap)/1.2 var(--font-display);text-align:center;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--b-soft);color:var(--b-ink);box-shadow:inset 0 0 0 2px var(--b)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,8.5em),1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;padding:10px 8px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--raised);color:var(--ink);box-shadow:var(--elev);font:500 1em/1.25 var(--font-display);text-align:center;cursor:pointer;transition:background-color .15s,border-color .15s}
.card .tile{background:var(--surface)}

/* ---------- safety + reply style (shared logic: docs/FEATURES_DO_NEXT.md §8–10) ---------- */
const RISK_PHRASES = ['kill myself','killing myself','kill my self','suicide','suicidal','end my life','end it all','take my life','want to die','wanna die','wish i was dead','wish i were dead','better off dead','better off without me','hang myself','self harm','hurt myself','hurting myself','harm myself','cut myself','cutting myself','dont want to live','no reason to live','unalive myself'];
const CHECK_PHRASES = ['want to disappear','cant go on','give up on everything','no point in anything','hopeless','worthless','hate my life','dead inside','overdose','nobody would care','cant do this anymore','dont want to be here'];
const RISK_TOKENS = ['kms','kys','unalive','sewerslide'];
const RISK_EMOJI = /[\u{1F52A}\u{1FA78}\u{26B0}\u{1FAA6}\u{1FAA2}]/u; // 🔪 🩸 ⚰ 🪦 🪢
function soundKey(s) {
  return String(s).toLowerCase()
    .replace(/\bd[yi]e\s+(my|your|his|her|their|the|it|this|that|a)\b/g, 'colour $1') // "dye my hair" is not "die"
    .replace(/[’']/g, '').replace(/[^a-z0-9\s]/g, ' ')
    .replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k')
    .replace(/z/g, 's').replace(/y/g, 'i').replace(/wh/g, 'w').replace(/kn/g, 'n')
    .replace(/([a-z])\1+/g, '$1').replace(/\s+/g, ' ').trim();
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
// phrase match: starts at a word start with the same first letter; exact prefix, or ~1 typo per 6 letters ending on a word end
function fuzzyHas(hay, starts, phrase) {
  const p = soundKey(phrase).replace(/ /g, '');
  const max = p.length >= 10 ? 2 : p.length >= 6 ? 1 : 0;
  const ends = new Set(starts.slice(1)); ends.add(hay.length);
  for (const i of starts) {
    if (hay[i] !== p[0]) continue;
    if (hay.startsWith(p, i)) return true;
    for (let len = p.length - max; max && len <= p.length + max; len++) {
      if (ends.has(i + len) && lev(hay.slice(i, i + len), p, max) <= max) return true;
    }
  }
  return false;
}
function riskCheck(text) {
  const raw = String(text || '');
  const key = soundKey(raw);
  const words = key ? key.split(' ') : [];
  if (words.some(w => RISK_TOKENS.includes(w))) return 'risk';
  let hay = ''; const starts = [];
  words.forEach(w => { starts.push(hay.length); hay += w; });
  if (RISK_PHRASES.some(p => fuzzyHas(hay, starts, p))) return 'risk';
  if (CHECK_PHRASES.some(p => fuzzyHas(hay, starts, p))) return 'check';
  if (RISK_EMOJI.test(raw) && words.length <= 4) return 'check';
  return 'none';
}
const LEVEL = { none: 0, check: 1, risk: 2 };
const maxLevel = (a, b) => (LEVEL[a] >= LEVEL[b] ? a : b);
const BANNED = ['hang in there','silver lining','bright side','everything happens for a reason','cheer up','be happy','stay positive','just be positive','good vibes','could be worse','piece of cake','every cloud','it is what it is','chin up','under the weather','beat yourself up','tough it out','man up','snap out of it'];
function styleCheck(text, { icons = true } = {}) {
  let tag = 'ok';
  const lines = cleanLines(text).map(l => l.replace(/^\[(ok|check|risk)\]\s*/i, (_, t) => { tag = t.toLowerCase(); return ''; })).filter(Boolean);
  let sentences = [];
  lines.forEach(l => (l.match(/[^.!?…]+(?:[.!?…]+["')\]]*)?/g) || [l]).map(s => s.trim()).filter(Boolean).forEach(s => {
    if (!stripEmoji(s) && sentences.length) sentences[sentences.length - 1] += ' ' + s; else sentences.push(s);
  }));
  const kept = sentences.filter(s => !BANNED.some(b => s.toLowerCase().includes(b)));
  if (kept.length) sentences = kept;
  const out = []; let count = 0;
  for (const s of sentences) {
    const w = stripEmoji(s).split(/\s+/).filter(Boolean).length;
    if (out.length === 3) break;
    if (count + w > 50) { if (!out.length) out.push(stripEmoji(s).split(/\s+/).slice(0, 50).join(' ') + '…'); break; }
    out.push(s); count += w;
  }
  const lines2 = out.map(s => {
    const emo = [...new Set(s.match(EMOJI_RE) || [])].slice(0, 2);
    const body = stripEmoji(s);
    return icons && emo.length ? body + ' ' + emo.join(' ') : body;
  }).filter(Boolean);
  return { tag, lines: lines2 };
}

/* ---------- storage: private per-person journal in the artifact db, device storage as fallback ---------- */
const Store = {
  mode: 'loading', loaded: false, cloud: [], local: LS.get('lexi.entries', []) || [], subs: new Set(),
  profileRef: null, entriesCol: null, chains: {}
};
Store.ready = new Promise(r => { Store._ready = r; });
Store.all = () => [...Store.cloud, ...Store.local].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
Store.emit = () => Store.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
Store.saveLocal = () => LS.set('lexi.entries', Store.local);
Store.newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
Store.chain = (id, fn) => (Store.chains[id] = (Store.chains[id] || Promise.resolve()).then(fn, fn));
Store.add = async entry => {
  await Store.ready;
  if (Store.mode === 'cloud') {
    const id = Store.newId('e');
    try { await Store.entriesCol.doc(id).set(entry); return { id, src: 'cloud' }; }
    catch (e) {
      console.warn('save failed', e);
      toast(e && e.code === 'quota_exceeded' ? 'Your journal is full. Delete old entries, then save again.' : 'Saved on this device only.');
    }
  }
  const id = Store.newId('l');
  Store.local.unshift({ ...entry, id, _src: 'local' });
  Store.saveLocal(); Store.emit();
  return { id, src: 'local' };
};
Store.update = (id, src, patch) => {
  if (src === 'cloud') return Store.chain(id, () => Store.entriesCol.doc(id).update(patch)).catch(e => { console.warn(e); toast("Couldn't save that change. Try again."); });
  const e = Store.local.find(x => x.id === id);
  if (e) { Object.assign(e, patch); Store.saveLocal(); Store.emit(); }
  return Promise.resolve();
};
Store.remove = (id, src) => {
  if (src === 'cloud') {
    Store.cloud = Store.cloud.filter(x => x.id !== id); Store.emit();
    return Store.chain(id, () => Store.entriesCol.doc(id).delete()).catch(e => { console.warn(e); toast("Couldn't delete that entry. Try again."); });
  }
  Store.local = Store.local.filter(x => x.id !== id); Store.saveLocal(); Store.emit();
  return Promise.resolve();
};

let profTimer = null, profChain = Promise.resolve();
function mirrorProfile() { LS.set('lexi.settings', profile.settings); LS.set('lexi.custom', profile.custom); LS.set('lexi.onboarded', profile.onboarded); }
function writeProfileNow() {

async function initStore() {
  const C = window.claude;
  let db = null, user = null, id = null;
  if (C && typeof C.use === 'function') {
    try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { console.warn(e); }
    if (user) { try { id = await user.id(); } catch {} }
  }
  if (db && id) {
    try {
      Store.profileRef = db.doc('data/users/' + id + '/profile');
      Store.entriesCol = Store.profileRef.collection('entries');
      Store.mode = 'cloud';
      try { const snap = await Store.profileRef.get(); if (snap.exists) mergeProfile(snap.data()); else writeProfileNow(); }
      catch (e) { console.warn('profile read', e); }
      Store.entriesCol.orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
        Store.cloud = snap.docs.map(d => ({ ...d.data(), id: d.id, _src: 'cloud' }));
        Store.loaded = true; Store.emit();
      }, err => {
        console.warn('entries', err);
        toast("Couldn't open your saved journal. Showing this device only.");
        Store.loaded = true; Store.emit();
      });
    } catch (e) { console.warn(e); Store.mode = 'local'; }
  } else Store.mode = 'local';
  if (Store.mode === 'local') Store.loaded = true;
  Store._ready(); Store.emit();
}

    const st = resume || { moods: [], nuance: [], keys: [], answers: {}, at: 'mood', asked: {}, chosen: false };
    if (resume) st.asked = { react: 1 };
    if (!fromIntro && !resume) await say("Let's check in. 🧭");
    const order = () => ['mood', ...(st.moods.length ? ['nuance'] : []), 'topics', ...st.keys.map(k => 't:' + k), 'recap'];
    const head = id => ({
      no: id === 'mood' || id === 'nuance' ? 1 : id === 'topics' ? 2 : id === 'recap' ? 3 + st.keys.length : 3 + st.keys.indexOf(id.slice(2)),
      total: st.chosen ? 3 + st.keys.length : 0
    });

    const nextAfter = cur => {
      const o = order(), i = o.indexOf(cur);

      return o[i + 1] || 'recap';
    };
    const before = cur => { const o = order(); return o[Math.max(0, o.indexOf(cur) - 1)]; };
    for (;;) {
      st.at = id; LS.set(DRAFT_KEY, st);
      if (!st.asked[id]) {
        st.asked[id] = 1;
        const T = id.startsWith('t:') ? TOPIC_BY[id.slice(2)] : null;
        await say(T ? T.icon + ' ' + T.q : STEP_Q[id]);
        await sayQueue;
      }
      let r;
      if (id === 'mood') {
        r = await moodCard({ prefill: st.moods, head: head(id) });
        st.moods = r.value;
        st.nuance = st.nuance.filter(n => st.moods.some(m => m.band === n.band));
        addAnswer(st.moods.length ? st.moods : [{ e: '⏭️', label: 'Skip' }]);
        if (!st.asked.react) { st.asked.react = 1; await say(reactionFor(st.moods)); }
        if (toRecap) st.asked.nuance = 1;
      } else if (id === 'nuance') {
        r = await nuanceCard({ bands: [...new Set(st.moods.map(m => m.band))], prefill: st.nuance, head: head(id) });
        if (!r.back) { st.nuance = r.value; if (st.nuance.length) addAnswer(st.nuance); }
      } else if (id === 'topics') {
        r = await topicCard({ prefill: st.keys, head: head(id) });
        if (!r.back) {
          st.keys = r.value; st.chosen = true;
          Object.keys(st.answers).forEach(k => { if (!st.keys.includes(k)) delete st.answers[k]; });
          addAnswer(st.keys.length ? st.keys.map(k => ({ e: TOPIC_BY[k].icon, label: TOPIC_BY[k].name })) : [{ e: '🌡️', label: 'Just my mood today' }]);
        }
      } else if (id.startsWith('t:')) {
        const k = id.slice(2);
        r = await topicAnswerCard(TOPIC_BY[k], { prefill: st.answers[k], head: head(id) });
        if (!r.back) { st.answers[k] = r.value; showAnswer(r.value); }
      } else {
        r = await recapCard(st, head(id));
        if (r.change) { toRecap = true; id = r.change; st.asked[id] = 1; continue; }
        if (r.save) break;
      }
      id = r.back ? before(id) : nextAfter(id);
    }
    LS.del(DRAFT_KEY);
    const topics = st.keys.map(k => st.answers[k]).filter(Boolean);
    const { moods, nuance } = st;
    if (!moods.length && !topics.length) { await say("Nothing to save this time. That's okay. 🏡"); await sayQueue; offerActions(); return; }
    const entry = { kind: 'guided', createdAt: Date.now(), day: dayKey(), moods, nuance, topics, text: '' };
    const ref = await Store.add(entry);
    const notes = topics.map(t => [t.note, ...(t.todos || []).map(x => x.t)].filter(Boolean).join('\n')).filter(Boolean).join('\n');
    const level = notes ? maxLevel(riskCheck(notes), await aiRisk(notes)) : 'none';

    await sayQueue;

}
function entrySummary(en) {

  (en.topics || []).forEach(tp => {
    const T = TOPIC_BY[tp.key]; const bits = [];

    if (tp.todos && tp.todos.length) bits.push(tp.todos.map(x => x.t + (x.done ? ' (done)' : '')).join(', '));

async function sendChat(text) {
  addMe(text);
  const local = riskCheck(text);
  if (local !== 'none') { await safetyFlow(local); return; }
  if (!sampleFn || !sampleOk) {
    const r = fallbackReply(text);
    if (r) await sayMany(r);
    else { await sayMany(["I can't chat freely right now. 🔌", 'You can still do a check-in or write on your own.']); await sayQueue; offerActions(); }
    return;
  }
  turns.push({ role: 'user', content: text });
  if (turns.length > 16) turns = turns.slice(-16);
  while (turns.length && turns[0].role !== 'user') turns.shift();
  await sayQueue;
  const ctl = new AbortController(); chatCtl = ctl; setSending(true);
  // Lexi thinks until the whole reply is checked, then shows it line by line (docs/DESIGN_WARM_PAPER.md §9):
  // text never changes under the reader.
  const typing = showTyping();
  const started = Date.now();
  let level = 'none';
  try {
    const res = await sampleFn([{ role: 'user', content: lexiRules() }, ...turns], { cache: false, modelTier: 'quick', signal: ctl.signal });
    if (ctl.signal.aborted) throw { code: 'cancelled' };
    const checked = styleCheck(res.text, { icons: profile.settings.icons });
    level = LEVEL[checked.tag] != null ? checked.tag : 'none';
    turns.push({ role: 'assistant', content: '[' + checked.tag + ']\n' + checked.lines.join('\n') });
    const wait = 600 - (Date.now() - started); if (wait > 0) await sleep(wait);
    typing.remove();
    if (chatCtl === ctl) { chatCtl = null; setSending(false); }
    sayQueue = sayQueue.then(async () => {
      for (let i = 0; i < checked.lines.length; i++) {
        if (i > 0) await beforeLine(checked.lines[i]);
        addBot(checked.lines[i]); lastBot = true;
      }
      if (res.truncated) addBot('That got cut short. Ask me for less at a time. ✂️', { info: true });
    });
    await sayQueue;
  } catch (e) {
    typing.remove();
    const m = sampleErr(e); if (m) addBot(m, { info: true });
  } finally {
    if (chatCtl === ctl) { chatCtl = null; setSending(false); }
    scrollDown();
  }
  if (level !== 'none') await safetyFlow(level);
}

$('#fw-tidy').onclick = async () => {

      'Find spelling mistakes and sound-alike word mix-ups (like there/their or here/hear) in the journal text. Do not change style, grammar, slang, emoji or capital letters. ' +
      'Reply with only JSON: {"fixes":[{"from":"the wrong word exactly as written","to":"the fixed word","kind":"spelling" or "sound-alike",' +
      '"hint":"sound-alike only: 2 to 4 simple words about the meaning of the fixed word","emoji":"sound-alike only: one emoji for that meaning",' +
      '"wrongHint":"sound-alike only: 2 to 4 simple words about the meaning of the word as written","wrongEmoji":"sound-alike only: one emoji for that meaning"}]}. ' +

sv.addEventListener('click', async e => {

  if (b.dataset.set) {
    const k = b.dataset.set; let v = b.dataset.val;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    profile.settings[k] = v; applySettings(); saveProfile(); autosize();

    const again = $('[data-set="' + k + '"][aria-pressed="true"]', sv); if (again) again.focus({ preventScroll: true });
    if (k === 'lexiVoice') speak(v === 'device' ? "Hi! I'm Lexi. I'll read with you." : "Hi! I'm Lexi. I'm here to make journaling easy and fun.");
    return;
  }

    speak("Hi! I'm Lexi. I'll read with you.", { voice: v });

    return;
  }
  if (b.dataset.play) { const v = voices.find(x => x.voiceURI === b.dataset.play); speak("Hi! I'm Lexi. I'm here to make journaling easy and fun.", { voice: v }); return; }
  const act = b.dataset.act;
  if (act === 'allvoices') { showAllVoices = !showAllVoices; renderSettings(); return; }
  if (act === 'testvoice') { speak("Hi! I'm Lexi, the journaling chatbot. I'm here to make journaling easy and fun."); return; }
  if (act === 'rm-custom') { const g = b.dataset.g, i = +b.dataset.i; (profile.custom[g] || []).splice(i, 1); saveProfile(); renderSettings(); return; }
  if (act === 'replay') { showView('home'); intro(); return; }

  if (act === 'wipe') { wipeAsk = true; renderSettings(); return; }

// Export (docs/FEATURES_SOON.md §8): a plain PDF made in the page, saved through the downloads capability
async function loadJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = res; s.onerror = rej; document.head.append(s);
  });
  return window.jspdf.jsPDF;
}
const pdfText = t => stripEmoji(String(t)).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/[–—]/g, '-').replace(/·/g, '-').replace(/[^\x20-\x7E\xA0-\xFF\n]/g, '');
async function exportPdf(days) {
  const C = window.claude;
  let dl = null;
  try { dl = C && typeof C.use === 'function' ? await C.use('downloads') : null; } catch {}
  if (!dl) { toast("Saving files doesn't work here. 📄"); return; }
  const since = days ? Date.now() - days * 86400000 : 0;
  const list = Store.all().filter(e => (e.createdAt || 0) >= since).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!list.length) { toast('No entries to share yet. 📖'); return; }
  let JsPDF;
  try { JsPDF = await loadJsPDF(); } catch { toast("Couldn't load the PDF maker. Try again. 🔌"); return; }
  const doc = new JsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 50;
  let y = M;
  const write = (text, { size = 12, bold = false, gap = 6 } = {}) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size);
    doc.splitTextToSize(pdfText(text), W - 2 * M).forEach(r => { if (y > H - M) { doc.addPage(); y = M; } doc.text(r, M, y); y += size * 1.45; });
    y += gap;
  };
  const dateLong = d => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  write('Lexi journal', { size: 22, bold: true });
  write(dateLong(new Date(list[0].createdAt)) + ' to ' + dateLong(new Date(list[list.length - 1].createdAt)) + ' - ' + list.length + (list.length === 1 ? ' entry' : ' entries'));
  write('Made with Lexi, a journaling app for dyslexic people.', { size: 10, gap: 18 });
  list.forEach(en => {
    const d = new Date(en.createdAt);
    write(dateLong(d) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' - ' + (en.kind === 'free' ? 'Free writing' : en.kind === 'voice' ? 'Voice entry' : 'Check-in'), { size: 13, bold: true, gap: 2 });
    entrySummary(en).split('\n').forEach(l => write(l, { gap: 2 }));
    if (en.reflection) write('Lexi: ' + en.reflection.replace(/\n/g, ' '), { size: 11, gap: 2 });
    y += 12;
  });
  try { await dl.save({ filename: 'lexi-journal.pdf', data: doc.output('blob') }); toast('Your journal PDF is ready. 📄'); }
  catch (e) { if (!e || e.code !== 'declined') toast("Couldn't save the PDF. Try again. 📄"); }
}
